$kind: http-request
name: 1.3 [Giá trị biên] Mật khẩu 5 ký tự (Dưới ngưỡng biên 6 ký tự)
url: "{{base_url}}/register"
method: POST
headers:
  Accept: application/json
body:
  type: urlencoded
  content:
    ten_dang_nhap: user_pass_5
    ten_khach_hang: Test Biên
    email: pass5@test.vn
    so_dien_thoai: "0981234567"
    password: "12345"
    password_confirmation: "12345"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Từ chối mật khẩu 5 ký tự: HTTP 200, 302 hoặc 422", function () {
          pm.expect(pm.response.code).to.be.oneOf([200, 302, 422]);
      });
    language: text/javascript
order: 3000

$kind: http-request
url: "{{base_url}}/register"
method: POST
headers:
  Accept: application/json
body:
  type: urlencoded
  content:
    ten_dang_nhap: user_mismatch
    ten_khach_hang: Khong Khop
    email: mismatch@test.vn
    so_dien_thoai: "0987654321"
    password: "123456"
    password_confirmation: "654321"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Lỗi xác nhận mật khẩu không khớp: HTTP 200, 302 hoặc 422", function () {
          pm.expect(pm.response.code).to.be.oneOf([200, 302, 422]);
      });
    language: text/javascript
order: 5000

$kind: http-request
name: 2.10 [Giá trị biên] Tên đăng nhập quá dài (300 ký tự)
url: "{{base_url}}/login"
method: POST
headers:
  Accept: application/json
  X-Fresh-Session: "1"
body:
  type: urlencoded
  content:
    ten_dang_nhap: 
    password: "{{customer_pass}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 422: từ chối đăng nhập", function () {
          pm.expect(pm.response.code).to.be.oneOf([422]);
      });
    language: text/javascript
settings:
  followRedirects: false
order: 10000

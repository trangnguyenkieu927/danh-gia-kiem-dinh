$kind: http-request
name: 2.12 [Ngoại lệ] Đúng tên tài khoản nhưng sai mật khẩu
url: "{{base_url}}/login"
method: POST
headers:
  Accept: application/json
  X-Fresh-Session: "1"
body:
  type: urlencoded
  content:
    ten_dang_nhap: "{{customer_user}}"
    password: MatKhauSaiHoanToan123
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 422: từ chối", function () {
          pm.expect(pm.response.code).to.be.oneOf([422]);
      });
      pm.test("Không cấp phiên đăng nhập (không chuyển tới dashboard)", function () {
          const l = pm.response.headers.get("Location") || "";
          pm.expect(l).to.not.match(/dashboard/);
      });
      pm.test("Thông báo lỗi giống hệt ca tài khoản không tồn tại (không lộ thông tin)", function () {
          pm.expect(JSON.stringify(pm.response.json().errors)).to.eql(pm.collectionVariables.get("login_fail_msg"));
      });
    language: text/javascript
settings:
  followRedirects: false
order: 12000

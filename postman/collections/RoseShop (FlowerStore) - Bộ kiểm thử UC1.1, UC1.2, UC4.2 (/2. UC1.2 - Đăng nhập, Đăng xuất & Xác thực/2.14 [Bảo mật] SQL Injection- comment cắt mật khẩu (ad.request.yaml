$kind: http-request
name: "2.14 [Bảo mật] SQL Injection: comment cắt mật khẩu (admin1' --)"
url: "{{base_url}}/login"
method: POST
headers:
  Accept: application/json
  X-Fresh-Session: "1"
body:
  type: urlencoded
  content:
    ten_dang_nhap: "{{admin_user}}' --"
    password: bat_ky
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 422: từ chối đăng nhập", function () {
          pm.expect(pm.response.code).to.be.oneOf([422]);
      });
      pm.test("Không gây lỗi 500", function () {
          pm.expect(pm.response.code).to.not.equal(500);
      });
      pm.test("Không cấp phiên đăng nhập (không chuyển tới dashboard)", function () {
          const l = pm.response.headers.get("Location") || "";
          pm.expect(l).to.not.match(/dashboard/);
      });
    language: text/javascript
settings:
  followRedirects: false
order: 14000

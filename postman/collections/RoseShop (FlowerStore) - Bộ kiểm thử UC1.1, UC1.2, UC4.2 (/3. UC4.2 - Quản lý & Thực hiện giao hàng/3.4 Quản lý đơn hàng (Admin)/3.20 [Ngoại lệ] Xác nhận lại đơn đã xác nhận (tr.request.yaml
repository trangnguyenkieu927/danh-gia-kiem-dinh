$kind: http-request
name: 3.20 [Ngoại lệ] Xác nhận lại đơn đã xác nhận (trạng thái không hợp lệ để chuyển)
url: "{{base_url}}/don-hang/{{order_id_confirm}}/confirm"
method: POST
headers:
  Accept: application/json
body:
  type: urlencoded
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 302 / 400 / 409 / 422: không cho xác nhận lần hai", function () {
          pm.expect(pm.response.code).to.be.oneOf([302, 400, 409, 422]);
      });
      pm.test("Không lỗi 500", function () {
          pm.expect(pm.response.code).to.not.equal(500);
      });
    language: text/javascript
settings:
  followRedirects: false
order: 7000

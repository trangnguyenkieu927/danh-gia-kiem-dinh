$kind: http-request
name: "3.17 [Hợp lệ] Admin huỷ đơn hàng (cần dữ liệu seed: order_id_cancel)"
url: "{{base_url}}/don-hang/{{order_id_cancel}}/cancel"
method: POST
headers:
  Accept: application/json
body:
  type: urlencoded
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 200 / 302: huỷ thành công", function () {
          pm.expect(pm.response.code).to.be.oneOf([200, 302]);
      });
    language: text/javascript
settings:
  followRedirects: false
order: 4000

$kind: http-request
url: "{{base_url}}/don-hang/999999999/cancel"
method: POST
headers:
  Accept: application/json
body:
  type: urlencoded
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 404 / 422: báo không tìm thấy đơn hàng", function () {
          pm.expect(pm.response.code).to.be.oneOf([404, 422]);
      });
      pm.test("Không lỗi 500", function () {
          pm.expect(pm.response.code).to.not.equal(500);
      });
    language: text/javascript
settings:
  followRedirects: false
order: 6000

$kind: http-request
name: 3.31 [Ngoại lệ] Cập nhật trạng thái đơn không tồn tại
url: "{{base_url}}/shipper/don-hang/999999999/cap-nhat"
method: PATCH
headers:
  Accept: application/json
body:
  type: urlencoded
  content:
    trang_thai: "{{ship_status_valid}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 404: không tìm thấy", function () {
          pm.expect(pm.response.code).to.be.oneOf([404]);
      });
      pm.test("Không lỗi 500", function () {
          pm.expect(pm.response.code).to.not.equal(500);
      });
    language: text/javascript
settings:
  followRedirects: false
order: 12000

$kind: http-request
url: "{{base_url}}/shipper/don-hang/{{order_id_ship}}/da-den-noi"
method: POST
headers:
  Accept: application/json
body:
  type: urlencoded
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 200 / 204 / 302: ghi nhận đã đến nơi", function () {
          pm.expect(pm.response.code).to.be.oneOf([200, 204, 302]);
      });
    language: text/javascript
settings:
  followRedirects: false
order: 7000

$kind: http-request
url: "{{base_url}}/shipper/thong-bao/so-chua-doc"
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 200: OK", function () {
          pm.expect(pm.response.code).to.be.oneOf([200]);
      });
      pm.test("Phản hồi là JSON hợp lệ", function () { pm.response.json(); });
    language: text/javascript
settings:
  followRedirects: false
order: 4000

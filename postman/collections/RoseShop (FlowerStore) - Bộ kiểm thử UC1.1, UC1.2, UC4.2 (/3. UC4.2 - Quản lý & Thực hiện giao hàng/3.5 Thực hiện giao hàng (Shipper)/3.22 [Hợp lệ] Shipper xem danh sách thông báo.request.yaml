$kind: http-request
url: "{{base_url}}/shipper/thong-bao"
method: GET
headers:
  Accept: text/html
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 200: OK", function () {
          pm.expect(pm.response.code).to.be.oneOf([200]);
      });
    language: text/javascript
settings:
  followRedirects: false
order: 3000

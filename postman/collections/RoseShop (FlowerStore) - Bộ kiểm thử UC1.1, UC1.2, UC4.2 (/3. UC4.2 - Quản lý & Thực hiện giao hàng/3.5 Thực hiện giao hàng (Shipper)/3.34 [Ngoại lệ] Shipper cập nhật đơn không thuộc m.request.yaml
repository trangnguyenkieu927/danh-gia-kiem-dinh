$kind: http-request
name: 3.34 [Ngoại lệ] Shipper cập nhật đơn không thuộc mình (order_id_other) — IDOR
url: "{{base_url}}/shipper/don-hang/{{order_id_other}}/cap-nhat"
method: PATCH
headers:
  Accept: application/json
body:
  type: urlencoded
  content:
    trang_thai: "{{ship_status_valid}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 403 / 404: không được thao tác đơn của shipper khác", function () {
          pm.expect(pm.response.code).to.be.oneOf([403, 404]);
      });
    language: text/javascript
settings:
  followRedirects: false
order: 15000

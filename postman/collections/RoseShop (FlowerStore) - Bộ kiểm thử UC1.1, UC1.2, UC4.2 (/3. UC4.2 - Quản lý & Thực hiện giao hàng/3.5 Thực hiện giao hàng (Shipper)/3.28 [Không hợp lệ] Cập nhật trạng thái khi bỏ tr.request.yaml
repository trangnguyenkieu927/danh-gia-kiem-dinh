$kind: http-request
name: 3.28 [Không hợp lệ] Cập nhật trạng thái khi bỏ trống dữ liệu
url: "{{base_url}}/shipper/don-hang/{{order_id_ship}}/cap-nhat"
method: PATCH
headers:
  Accept: application/json
body:
  type: urlencoded
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 422: từ chối khi thiếu trạng thái", function () {
          pm.expect(pm.response.code).to.be.oneOf([422]);
      });
      pm.test("Phản hồi có lỗi validate tại: trang_thai", function () {
          const j = pm.response.json();
          pm.expect(j).to.have.property("errors");
          ["trang_thai"].forEach(function (k) { pm.expect(j.errors).to.have.property(k); });
      });
    language: text/javascript
settings:
  followRedirects: false
order: 9000

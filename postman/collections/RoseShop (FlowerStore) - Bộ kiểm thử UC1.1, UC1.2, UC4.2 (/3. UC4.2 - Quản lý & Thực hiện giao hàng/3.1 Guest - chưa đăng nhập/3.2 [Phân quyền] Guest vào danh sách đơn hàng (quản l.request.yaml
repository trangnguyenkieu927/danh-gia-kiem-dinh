$kind: http-request
name: 3.2 [Phân quyền] Guest vào danh sách đơn hàng (quản lý)
url: "{{base_url}}/don-hang"
method: GET
headers:
  Accept: text/html
  X-Fresh-Session: "1"
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 302: Guest bị chuyển hướng", function () {
          pm.expect(pm.response.code).to.be.oneOf([302]);
      });
      pm.test("Chuyển về /login", function () {
          const l = pm.response.headers.get("Location") || "";
          pm.expect(l).to.match(/\/login/);
      });
    language: text/javascript
settings:
  followRedirects: false
order: 2000

$kind: http-request
url: "{{base_url}}/don-hang/{{order_id_confirm}}/confirm"
method: POST
headers:
  Accept: application/json
  X-Fresh-Session: "1"
body:
  type: urlencoded
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 401: Guest nhận 401 Unauthenticated", function () {
          pm.expect(pm.response.code).to.be.oneOf([401]);
      });
    language: text/javascript
settings:
  followRedirects: false
order: 6000

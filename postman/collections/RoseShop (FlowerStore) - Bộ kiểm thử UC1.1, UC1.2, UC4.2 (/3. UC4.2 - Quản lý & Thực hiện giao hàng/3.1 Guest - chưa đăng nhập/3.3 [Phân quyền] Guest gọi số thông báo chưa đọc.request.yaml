$kind: http-request
url: "{{base_url}}/shipper/thong-bao/so-chua-doc"
method: GET
headers:
  Accept: application/json
  X-Fresh-Session: "1"
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 401: Guest nhận 401 Unauthenticated", function () {
          pm.expect(pm.response.code).to.be.oneOf([401]);
      });
    language: text/javascript
settings:
  followRedirects: false
order: 3000

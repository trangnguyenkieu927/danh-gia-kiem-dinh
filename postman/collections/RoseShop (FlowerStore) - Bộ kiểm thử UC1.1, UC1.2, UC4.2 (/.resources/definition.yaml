$kind: collection
name: RoseShop (FlowerStore) - Bộ kiểm thử UC1.1, UC1.2, UC4.2 (Nhóm 07)
description: |-
  Kiểm thử các route web của Laravel cho UC1.1 Đăng ký, UC1.2 Đăng nhập/Phân quyền, UC4.2 Quản lý & thực hiện giao hàng.

  Tiền đề: DB test đã seed các tài khoản (customer_user, admin_user, shipper_user) và 4 đơn hàng phục vụ UC4.2 (xem biến collection order_id_*). Chạy theo thứ tự thư mục bằng Collection Runner (Postman app, bật Save cookies). Script cấp collection tự xử lý CSRF và phiên mới.
variables:
  base_url: http://127.0.0.1:8000
  customer_user: khachhang
  customer_pass: "123456"
  admin_user: admin1
  admin_pass: "123456"
  shipper_user: shipper1
  shipper_pass: "123456"
  order_id_confirm: "1"
  order_id_cancel: "2"
  order_id_ship: "3"
  order_id_other: "4"
  ma_hoa_don_ship: HD003
  ship_status_valid: dang_giao
  reg_user: ""
  reg_email: ""
  reg_phone: ""
  login_fail_msg: ""
scripts:
  - type: http:beforeRequest
    code: |
      // ===== Pre-request cấp collection =====
      // 1) Sinh dữ liệu duy nhất cho mỗi request
      pm.variables.set('uniq', Date.now().toString().slice(-8));

      // 2) Phiên mới nếu request gắn header X-Fresh-Session
      const base = pm.variables.get('base_url');
      const fresh = pm.request.headers.has('X-Fresh-Session');
      if (fresh) { pm.request.headers.remove('X-Fresh-Session'); }

      // 3) Request ghi dữ liệu cần CSRF token (Laravel web route)
      const needCsrf = !['GET', 'HEAD', 'OPTIONS'].includes(pm.request.method) && !pm.variables.get('skip_csrf');
      function attachCsrf() {
          if (!needCsrf) { return; }
          pm.sendRequest({ url: base + '/', method: 'GET' }, function () {
              pm.cookies.jar().get(base, 'XSRF-TOKEN', function (err, value) {
                  if (err || !value) { console.warn('Không lấy được XSRF-TOKEN'); return; }
                  pm.request.headers.upsert({ key: 'X-XSRF-TOKEN', value: decodeURIComponent(value) });
              });
          });
      }
      if (fresh) { pm.cookies.jar().clear(base, attachCsrf); } else { attachCsrf(); }
    language: text/javascript

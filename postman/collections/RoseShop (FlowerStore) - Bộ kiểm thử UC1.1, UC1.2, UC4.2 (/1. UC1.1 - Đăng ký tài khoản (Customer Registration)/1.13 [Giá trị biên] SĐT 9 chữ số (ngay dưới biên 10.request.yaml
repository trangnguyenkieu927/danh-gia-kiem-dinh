$kind: http-request
name: 1.13 [Giá trị biên] SĐT 9 chữ số (ngay dưới biên 10)
url: "{{base_url}}/register"
method: POST
headers:
  Accept: application/json
  X-Fresh-Session: "1"
body:
  type: urlencoded
  content:
    ten_dang_nhap: khach_{{uniq}}
    ten_khach_hang: Nguyễn Văn Test
    email: khach_{{uniq}}@example.test
    so_dien_thoai: 09{{uniq7}}
    password: "123456"
    password_confirmation: "123456"
    quan_huyen: Nam Từ Liêm
    xa_phuong: Trung Văn
    dia_chi_chi_tiet: Số 10 Phố Hoa
scripts:
  - type: beforeRequest
    code: pm.variables.set("uniq7", pm.variables.get("uniq").slice(-7));
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("HTTP 422: từ chối SĐT 9 số", function () {
          pm.expect(pm.response.code).to.be.oneOf([422]);
      });
      pm.test("Phản hồi có lỗi validate tại: so_dien_thoai", function () {
          const j = pm.response.json();
          pm.expect(j).to.have.property("errors");
          ["so_dien_thoai"].forEach(function (k) { pm.expect(j.errors).to.have.property(k); });
      });
    language: text/javascript
settings:
  followRedirects: false
order: 13000

$kind: http-request
name: 1.1 [Hợp lệ] Đăng ký khách hàng mới với đầy đủ dữ liệu hợp lệ
url: "{{base_url}}/register"
method: POST
headers:
  Accept: application/json
  X-Fresh-Session: "1"
body:
  type: urlencoded
  content:
    ten_dang_nhap: khach_{{uniq}}
    ten_khach_hang: Nguyễn Văn Test
    email: khach_{{uniq}}@example.test
    so_dien_thoai: 09{{uniq}}
    password: "123456"
    password_confirmation: "123456"
    quan_huyen: Nam Từ Liêm
    xa_phuong: Trung Văn
    dia_chi_chi_tiet: Số 10 Phố Hoa
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 200 / 201 / 204 / 302: đăng ký thành công", function () {
          pm.expect(pm.response.code).to.be.oneOf([200, 201, 204, 302]);
      });
      pm.test("Thời gian phản hồi < 3000ms", function () {
          pm.expect(pm.response.responseTime).to.be.below(3000);
      });
      if ([200, 201, 204, 302].includes(pm.response.code)) {
          const u = pm.variables.get("uniq");
          pm.collectionVariables.set("reg_user", "khach_" + u);
          pm.collectionVariables.set("reg_email", "khach_" + u + "@example.test");
          pm.collectionVariables.set("reg_phone", "09" + u);
      }
    language: text/javascript
settings:
  followRedirects: false
order: 1000

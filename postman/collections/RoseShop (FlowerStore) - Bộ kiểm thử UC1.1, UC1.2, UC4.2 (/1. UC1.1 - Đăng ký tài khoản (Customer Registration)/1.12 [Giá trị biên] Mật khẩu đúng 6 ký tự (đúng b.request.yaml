$kind: http-request
name: 1.12 [Giá trị biên] Mật khẩu đúng 6 ký tự (đúng biên dưới)
url: "{{base_url}}/register"
method: POST
headers:
  Accept: application/json
  X-Fresh-Session: "1"
body:
  type: urlencoded
  content:
    ten_dang_nhap: khach_{{uniq}}
    ten_khach_hang: Nguyễn Văn Test
    email: khach_{{uniq}}@example.test
    so_dien_thoai: 09{{uniq}}
    password: "123456"
    password_confirmation: "123456"
    quan_huyen: Nam Từ Liêm
    xa_phuong: Trung Văn
    dia_chi_chi_tiet: Số 10 Phố Hoa
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 200 / 201 / 204 / 302: chấp nhận mật khẩu 6 ký tự", function () {
          pm.expect(pm.response.code).to.be.oneOf([200, 201, 204, 302]);
      });
    language: text/javascript
settings:
  followRedirects: false
order: 12000

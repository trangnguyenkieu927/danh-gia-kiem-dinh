$kind: http-request
url: "{{base_url}}/register"
method: POST
headers:
  Accept: application/json
  X-Fresh-Session: "1"
body:
  type: urlencoded
  content:
    ten_dang_nhap: x'; DROP TABLE users;--
    ten_khach_hang: Nguyễn Văn Test
    email: khach_{{uniq}}@example.test
    so_dien_thoai: 09{{uniq}}
    password: "123456"
    password_confirmation: "123456"
    quan_huyen: Nam Từ Liêm
    xa_phuong: Trung Văn
    dia_chi_chi_tiet: Số 10 Phố Hoa
scripts:
  - type: afterResponse
    code: |-
      pm.test("Không gây lỗi 500 khi nhận payload SQLi", function () {
          pm.expect(pm.response.code).to.not.equal(500);
      });
      pm.test("HTTP 200 / 201 / 204 / 302 / 422: xử lý có kiểm soát", function () {
          pm.expect(pm.response.code).to.be.oneOf([200, 201, 204, 302, 422]);
      });
    language: text/javascript
settings:
  followRedirects: false
order: 22000
